[versions]
agp = "9.4.1"
android-compileSdk = "36"
android-minSdk = "24"
kotlin = "2.4.21"
synKotlin = "0.3.12"
procMacro2 = "0.1.6"
procMacro = "0.1.4"
quote = "0.2.5"
jvm = "21"
androidTestRunner = "1.7.0"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
node = "24.22.0"
yarn = "1.22.22"
karma = "npm:karma-maintained@6.4.8"
mocha = "12.0.0-beta-10"
webpackCli = "7.2.3"
webpack = "5.111.1"
npmDiff = "8.0.3"
npmFastUri = "3.1.7"
npmSerializeJavascript = "7.0.5"
npmFollowRedirects = "1.16.0"
npmLodash = "4.18.1"
npmAjv = "8.20.0"
npmBraceExpansion = "5.0.9"
npmFlatted = "3.4.2"
npmMinimatch = "10.2.5"
npmPicomatch = "4.0.4"
npmQs = "6.16.0"
npmSocketIoParser = "4.2.7"
npmWs = "8.21.0"
futures = "0.2.1"
npmTypesEstree = "1.0.9"
npmTypesNode = "25.9.1"
npmBaselineBrowserMapping = "2.11.12"
npmCaniuseLite = "1.0.30001809"
npmElectronToChromium = "1.5.402"
npmEnhancedResolve = "5.24.4"
npmMimeDb = "1.54.0"
npmNodeReleases = "2.0.53"
npmTerser = "5.51.0"
npmTerserWebpackPlugin = "5.6.1"
npmWebpackSources = "3.5.1"
npmUaParserJs = "2.0.10"
npmTmp = "0.2.7"
npmBodyParser = "2.3.0"
npmJsYaml = "4.3.2"
npmBrowserslist = "4.28.8"
kotlinWebHelpers = "3.1.0"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
androidKmp = "9.4.1"
kotlinxBenchmark = "0.5.0"
tracing = "0.1.0"

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
proc-macro-kotlin = { module = "io.github.kotlinmania:proc-macro-kotlin", version.ref = "procMacro" }
futures-kotlin = { module = "io.github.kotlinmania:futures-kotlin", version.ref = "futures" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
syn-kotlin = { module = "io.github.kotlinmania:syn-kotlin", version.ref = "synKotlin" }
proc-macro2-kotlin = { module = "io.github.kotlinmania:proc-macro2-kotlin", version.ref = "procMacro2" }
quote-kotlin = { module = "io.github.kotlinmania:quote-kotlin", version.ref = "quote" }
android-test-runner = { module = "androidx.test:runner", version.ref = "androidTestRunner" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
tracing-kotlin = { module = "io.github.kotlinmania:tracing-kotlin", version.ref = "tracing" }

[bundles]
async-trait-commonMain = ["kotlinx-coroutines-core", "kotlinx-serialization-core", "kotlinx-serialization-json", "kotlinx-datetime", "collections-immutable", "syn-kotlin", "proc-macro2-kotlin", "quote-kotlin"]
async-trait-commonTest = ["futures-kotlin", "tracing-kotlin"]
