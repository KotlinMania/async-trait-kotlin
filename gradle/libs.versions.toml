[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
androidKmp = "9.4.1"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
synKotlin = "0.3.12"
procMacro2 = "0.1.6"
quote = "0.2.5"
futures = "0.2.1"
tracing = "0.1.0"
intellijCoroutines = "1.10.2-intellij-1"
jvmToolchain = "21"
androidCompileSdk = "34"
androidMinSdk = "24"
androidBuildTools = "36.0.0"
androidCommandLineTools = "14742923"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
node = "24.15.0"
yarn = "1.22.22"
webpackCli = "7.0.2"
karma = "npm:karma-maintained@6.4.7"
mocha = "12.0.0-beta-10"
kotlinWebHelpers = "3.1.0"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
syn-kotlin = { module = "io.github.kotlinmania:syn-kotlin", version.ref = "synKotlin" }
proc-macro2-kotlin = { module = "io.github.kotlinmania:proc-macro2-kotlin", version.ref = "procMacro2" }
quote-kotlin = { module = "io.github.kotlinmania:quote-kotlin", version.ref = "quote" }
futures-kotlin = { module = "io.github.kotlinmania:futures-kotlin", version.ref = "futures" }
tracing-kotlin = { module = "io.github.kotlinmania:tracing-kotlin", version.ref = "tracing" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[bundles]
common-main = [
  "kotlinx-coroutines-core",
  "kotlinx-serialization-core",
  "kotlinx-serialization-json",
  "kotlinx-datetime",
  "collections-immutable",
  "syn-kotlin",
  "proc-macro2-kotlin",
  "quote-kotlin",
]
common-test = [
  "futures-kotlin",
  "tracing-kotlin",
]
android-device-test = [
  "androidx-test-runner",
  "androidx-test-ext-junit",
]
