org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx3g -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC
kotlin.incremental=false
kotlin.incremental.native=false
kotlin.build.report.output=file
kotlin.build.report.include_compiler_arguments=true
kotlin.native.parallelThreads=0
kotlin.native.ignoreDisabledTargets=true

# Project coordinates and layout
project.group=io.github.kotlinmania
project.version=0.1.3
project.name=async-trait-kotlin
project.frameworkName=AsyncTrait
project.namespace=io.github.kotlinmania.asynctrait

# POM Metadata
project.pom.description=Kotlin Multiplatform port of Rust's async-trait crate: type erasure for async trait methods
project.pom.licenseName=MIT
project.pom.licenseUrl=https://opensource.org/licenses/MIT


# Feature imports
# Opt-ins for every Kotlin compilation, in the root and android projects.
project.kotlin.optIns=kotlin.time.ExperimentalTime,kotlin.concurrent.atomics.ExperimentalAtomicApi,kotlin.ExperimentalUnsignedTypes

# Every version (Kotlin, plugins, libraries, JVM toolchain, Android SDK levels,
# Node, Yarn and the Kotlin/JS test packages) lives in gradle/libs.versions.toml.

# Yarn security resolutions
yarn.resolution.diff=8.0.3
yarn.resolution.fast-uri=3.1.7
yarn.resolution.serialize-javascript=7.0.5
# webpack resolution is sourced from kotlin-js-store/package.json in
# build.gradle.kts (Dependabot-managed); do not pin it here.
yarn.resolution.@types/estree=1.0.9
yarn.resolution.@types/node=25.9.1
yarn.resolution.baseline-browser-mapping=2.11.12
yarn.resolution.caniuse-lite=1.0.30001809
yarn.resolution.electron-to-chromium=1.5.402
yarn.resolution.enhanced-resolve=5.24.4
yarn.resolution.mime-db=1.54.0
yarn.resolution.node-releases=2.0.53
yarn.resolution.terser=5.51.0
yarn.resolution.terser-webpack-plugin=5.6.1
yarn.resolution.webpack-sources=3.5.1
yarn.resolution.follow-redirects=1.16.0
yarn.resolution.lodash=4.18.1
yarn.resolution.ajv=8.20.0
yarn.resolution.brace-expansion=5.0.9
yarn.resolution.flatted=3.4.2
yarn.resolution.minimatch=10.2.5
yarn.resolution.picomatch=4.0.4
yarn.resolution.qs=6.16.0
yarn.resolution.socket.io-parser=4.2.7
yarn.resolution.ua-parser-js=2.0.10
yarn.resolution.ws=8.21.0
yarn.resolution.tmp=0.2.7
yarn.resolution.body-parser=2.3.0
yarn.resolution.js-yaml=4.3.2
yarn.resolution.browserslist=4.28.8

# Repo-specific extra configurations
kotlin.swift-export.experimental.nowarn=true
