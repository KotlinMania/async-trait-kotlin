# Gradle
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC

# Kotlin Multiplatform
kotlin.code.style=official
kotlin.incremental=false
kotlin.incremental.native=false
kotlin.build.report.output=file
kotlin.build.report.include_compiler_arguments=true
kotlin.native.parallelThreads=0
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.swift-export.experimental.nowarn=true

# Project coordinates and layout
project.group=io.github.kotlinmania
project.version=0.1.3
project.name=async-trait-kotlin
project.frameworkName=AsyncTrait
project.namespace=io.github.kotlinmania.asynctrait

# POM Metadata
project.pom.description=Kotlin Multiplatform port of Rust's async-trait crate: type erasure for async trait methods
project.pom.licenseName=MIT
project.pom.licenseUrl=https://opensource.org/licenses/MIT

# Native C bindings (FFI channels: cinterop, JNI, N-API)
project.ffi.native=false
project.ffi.jvm=false
project.ffi.napi=false
project.ffi.name=AsyncTrait

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
