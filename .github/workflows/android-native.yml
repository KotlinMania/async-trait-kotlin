name: Build (Android Native)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Android Native)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build and test Android Native targets
        # Every Android Native output and runnable test is wired in build.gradle.kts as ciAndroidNative.
        run: ./gradlew ciAndroidNative --no-configuration-cache
