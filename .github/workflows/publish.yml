name: Publish to Maven Central

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish and release to Maven Central (requires secrets)"
        type: boolean
        required: false
        default: false

# Publishing targets Maven Central via the Sonatype Central Portal using external secrets;
# no GitHub-side write permissions are needed. Checkout only requires read.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          check-latest: true

      - name: Set up Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Check JavaScript toolchain
        run: |
          node --version
          npm --version
          yarn --version

      - name: Verify publication bundle (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        env:
          ORG_GRADLE_PROJECT_kotlin_js_yarn_download: "false"
        run: ./gradlew setupAndroidSdk prepareAndroidPublicationVerification --no-configuration-cache

      - name: Resolve and compile the packaged Android publication (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        env:
          ANDROID_HOME: ${{ github.workspace }}/.android-sdk
        run: >
          env -u ANDROID_SDK_ROOT ./gradlew -p verification/android-consumer
          verifyAndroidPublication
          --refresh-dependencies
          --no-configuration-cache

      - name: Publish to Maven Central
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: ./gradlew setupAndroidSdk publishToCentralPortal -PcentralPublishingType=AUTOMATIC --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_kotlin_js_yarn_download: "false"
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}

      - name: Upload publication and executed consumer test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-publication-verification
          path: |
            build/reports/publication/
            verification/android-consumer/build/reports/publication/
            verification/android-consumer/build/test-results/
          if-no-files-found: error
