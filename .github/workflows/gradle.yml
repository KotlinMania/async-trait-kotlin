name: Kotlin Multiplatform validation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - uses: android-actions/setup-android@v4
      - name: Inventory installed Apple simulators
        run: xcrun simctl list --json
      - name: Compile, link, package and execute Apple, web and JVM tests
        env:
          SDK_NAME: macosx
          CONFIGURATION: Debug
          ARCHS: arm64
          BUILT_PRODUCTS_DIR: ${{ github.workspace }}/library/build/swift-test
          TARGET_BUILD_DIR: ${{ github.workspace }}/library/build/swift-test
          FRAMEWORKS_FOLDER_PATH: Frameworks
          MACOSX_DEPLOYMENT_TARGET: '15.0'
          DEPLOYMENT_TARGET_SETTING_NAME: MACOSX_DEPLOYMENT_TARGET
        run: >-
          ./gradlew test build
          :library:preparePublicationVerification :library:prepareAndroidPublicationVerification --continue --no-configuration-cache --console=plain --no-daemon --max-workers=2
      - name: Compile a separate consumer against the verified Central bundle
        if: always()
        run: >-
          ./gradlew -p verification/consumer
          -PlibraryVersion="$(sed -n 's/^project.version=//p' gradle.properties)"
          verifyPublication allTests --refresh-dependencies --continue --no-configuration-cache --console=plain --no-daemon --max-workers=2
      - name: Execute the verified Android AAR consumer tests
        if: always()
        run: >-
          env -u ANDROID_SDK_ROOT ./gradlew -p verification/android-consumer
          verifyAndroidPublication --refresh-dependencies --no-configuration-cache
          --console=plain --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apple-results
          path: |
            library/build/reports
            library/build/test-results
            library/build/XCFrameworks
            verification/consumer/build/reports
            verification/consumer/build/test-results
            verification/android-consumer/build/reports
            verification/android-consumer/build/test-results

  native-hosts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: ':library:build :library:allTests :library:prepareLinuxArm64Test'
          - os: windows-latest
            tasks: ':library:build :library:mingwX64Test'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - uses: android-actions/setup-android@v4
      - name: Compile and execute tests on their native host
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} --continue --no-configuration-cache --console=plain --no-daemon --max-workers=2
      - name: Hash the cross-linked Linux ARM64 executable
        if: matrix.os == 'ubuntu-latest'
        working-directory: library/build/linux-arm64-test
        run: sha256sum test.kexe > test.kexe.sha256
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: linux-arm64-tests-${{ github.sha }}
          path: library/build/linux-arm64-test/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            library/build/reports
            library/build/test-results

  linux-arm64-runtime:
    needs: native-hosts
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: linux-arm64-tests-${{ github.sha }}
          path: library/build/linux-arm64-test
      - name: Check Native execution evidence guards
        run: python3 verification/test_linux_arm64_runner.py
      - name: Execute the exact cross-linked binary on Linux ARM64
        run: >-
          python3 verification/run_linux_arm64_tests.py
          library/build/linux-arm64-test/test.kexe
          --revision '${{ github.sha }}'
          --reports library/build/reports/linux-arm64-runtime
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-arm64-runtime-results
          path: library/build/reports/linux-arm64-runtime/
          if-no-files-found: error

  android-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator system-images;android-36;google_apis;x86_64'
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute instrumentation and Native x64 tests on the Android SDK emulator
        timeout-minutes: 45
        env:
          ANDROID_SERIAL_X64: emulator-5554
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p library/build/reports/android-emulator
          printf 'no\n' | avdmanager create avd -n async-trait-ci -k 'system-images;android-36;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd async-trait-ci -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > library/build/reports/android-emulator/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'adb -s "$ANDROID_SERIAL_X64" emu kill || true; wait "$emulator_pid" || true' EXIT
          timeout 360s adb -s "$ANDROID_SERIAL_X64" wait-for-device
          boot_deadline=$((SECONDS + 360))
          until [[ "$(adb -s "$ANDROID_SERIAL_X64" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; do
            kill -0 "$emulator_pid"
            if (( SECONDS >= boot_deadline )); then
              cat library/build/reports/android-emulator/emulator.log
              exit 1
            fi
            sleep 4
          done
          adb -s "$ANDROID_SERIAL_X64" shell getprop ro.product.cpu.abi
          env -u ANDROID_SDK_ROOT ./gradlew :library:connectedAndroidDeviceTest :library:androidNativeX64Test --continue --no-configuration-cache --console=plain --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-x64-results
          path: |
            library/build/reports
            library/build/test-results
            library/build/outputs/androidTest-results
