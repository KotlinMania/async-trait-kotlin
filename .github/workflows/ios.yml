name: Build (iOS)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (iOS)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build and test iOS targets
        # Every iOS output and runnable test is wired in build.gradle.kts as ciIos.
        run: ./gradlew ciIos --no-configuration-cache

      # Native upload-artifact (GitHub-published) makes the test reports
      # downloadable from the run summary page. `if: success() || failure()`
      # ensures uploads even when tests fail. Combined with the per-test
      # testLogging events in build.gradle.kts, the audit trail covers both
      # raw-log streaming and post-run inspection.
      - name: Upload test reports (iOS)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-ios
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
