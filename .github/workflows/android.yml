name: Build (Android)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build and test Android targets
        run: >
          ./gradlew
          setupAndroidSdk
          compileAndroidMain
          assembleUnitTest
          assembleAndroidTest
          testAndroidHostTest
          prepareAndroidPublicationVerification
          --no-configuration-cache

      - name: Resolve and compile the packaged Android publication
        env:
          ANDROID_HOME: ${{ github.workspace }}/.android-sdk
        run: >
          env -u ANDROID_SDK_ROOT ./gradlew -p verification/android-consumer
          verifyAndroidPublication
          --refresh-dependencies
          --no-configuration-cache

      - name: Upload Android publication and executed consumer test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-publication-verification
          path: |
            build/reports/publication/
            verification/android-consumer/build/reports/publication/
            verification/android-consumer/build/test-results/
          if-no-files-found: error
