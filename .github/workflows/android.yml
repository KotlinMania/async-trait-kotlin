name: Build (Android)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build Android target
        # build.gradle.kts defines buildAndroid: compiles and assembles every target; runs no tests.
        run: ./gradlew buildAndroid --no-configuration-cache

      - name: Test Android target
        # build.gradle.kts defines testAndroid: host tests, then device tests on the managed emulator.
        run: ./gradlew testAndroid --no-configuration-cache
