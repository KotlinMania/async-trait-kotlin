name: Build (Android)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build Android target
        # android/build.gradle.kts: the AAR and the host and device test packages.
        run: ./gradlew :android:build --no-configuration-cache

      - name: Test Android target
        # android/build.gradle.kts: host tests, then device tests on the managed emulator.
        run: ./gradlew :android:test --no-configuration-cache
