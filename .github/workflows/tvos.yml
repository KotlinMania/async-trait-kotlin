name: Build (tvOS)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (tvOS)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build tvOS targets
        # build.gradle.kts defines buildTvos: compiles and assembles every target; runs no tests.
        run: ./gradlew buildTvos --no-configuration-cache

      - name: Test tvOS targets
        # build.gradle.kts defines testTvos: every test this runner can execute.
        run: ./gradlew testTvos --no-configuration-cache

      - name: Upload test reports (tvOS)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-tvos
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
