name: Build (Linux)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build and test Linux targets
        # linuxX64 runs natively on ubuntu-latest; linuxArm64 cross-compiles
        # on x64 hosts (no test execution — needs an arm64 runner or qemu).
        run: >
          ./gradlew
          :library:compileKotlinLinuxX64
          :library:compileKotlinLinuxArm64
          :library:linuxX64Test
          --no-configuration-cache

      - name: Upload test reports (Linux)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux
          path: |
            library/build/reports/tests/
            library/build/test-results/
          retention-days: 7
          if-no-files-found: warn
