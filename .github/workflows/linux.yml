name: Build (Linux)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build and test Linux targets
        # Every Linux output and runnable test is wired in build.gradle.kts as ciLinux.
        run: ./gradlew ciLinux --no-configuration-cache

      - name: Upload test reports (Linux)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
